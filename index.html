        // === FUNGSI BUAT KEY UNIK ===
        function getCurrentBuildKey() {
            const items = [];
            for(let i=1; i<=6; i++) {
                const img = document.getElementById('slot'+i+'-img').src;
                if(img && img !== window.location.href) {
                    items.push(img);
                }
            }
            return btoa(items.sort().join('|'));
        }

        // === FUNGSI MODAL ===
        window.bukaModal = function(slotId) {
            slotTerpilih = slotId;
            const container = document.getElementById('equipmentOptions');
            container.innerHTML = '';

            let dataArray = [];
            if(slotId === 'slot1') dataArray = slot1ImageUrls;
            else if(slotId === 'slot2') dataArray = slot2ImageUrls;
            else if(slotId === 'slot3') dataArray = slot3ImageUrls;
            else if(slotId === 'slot4') dataArray = slot4ImageUrls;
            else if(slotId === 'slot5') dataArray = slot5ImageUrls;
            else if(slotId === 'slot6') dataArray = slot6ImageUrls;

            dataArray.forEach(url => {
                const div = document.createElement('div');
                div.className = 'equipment-option';
                div.innerHTML = `<img src="${url}" alt="item">`;
                div.onclick = () => {
                    document.getElementById(slotId+'-img').src = url;
                    tutupModal();
                };
                container.appendChild(div);
            });

            document.getElementById('equipmentModal').style.display = 'block';
        }

        window.tutupModal = function() {
            document.getElementById('equipmentModal').style.display = 'none';
        }

        window.onclick = function(event) {
            const modal = document.getElementById('equipmentModal');
            if (event.target == modal) {
                tutupModal();
            }
        }

        // === FUNGSI LIKE (TIDAK DIUBAH) ===
        window.toggleLike = function(slotId) {
            const imgElement = document.getElementById(slotId + '-img');
            const imageUrl = imgElement.src;

            if (!imageUrl || imageUrl === window.location.href) return;

            const likeRef = ref(db, 'likes/' + btoa(imageUrl));

            if(!userLiked[imageUrl]) {
                runTransaction(likeRef, (current) => {
                    return (current || 0) + 1;
                });
                userLiked[imageUrl] = true;
            } else {
                runTransaction(likeRef, (current) => {
                    return Math.max((current || 0) - 1, 0);
                });
                userLiked[imageUrl] = false;
            }
        }

        function updateLikeDisplay(slotId) {
            const imgElement = document.getElementById(slotId + '-img');
            const imageUrl = imgElement.src;
            const countElement = document.getElementById('like-count-' + slotId);
            const btnElement = document.getElementById('like-btn-' + slotId);

            if (!imageUrl || imageUrl === window.location.href) {
                countElement.innerText = "0";
                btnElement.classList.remove('liked');
                return;
            }

            const likeRef = ref(db, 'likes/' + btoa(imageUrl));
            onValue(likeRef, (snapshot) => {
                const jumlahLike = snapshot.val() || 0;
                countElement.innerText = jumlahLike;
            });

            btnElement.classList.toggle('liked', userLiked[imageUrl]);
        }

        // === FUNGSI VOTE & RANKING (SUDAH DIPERBAIKI) ===
        window.voteBuild = function(rank) {
            const items = [];
            for(let i=1; i<=6; i++) {
                const img = document.getElementById('slot'+i+'-img').src;
                if(img && img !== window.location.href) {
                    items.push(img);
                }
            }

            if(items.length === 0) {
                alert("Pilih setidaknya satu item dulu!");
                return;
            }

            const buildKey = items.sort().join('|');
            const buildKeyEncoded = btoa(buildKey);
            const buildRef = ref(db, 'builds/' + buildKeyEncoded);

            // CEK APAKAH USER SUDAH VOTE UNTUK BUILD INI?
            if(!userVotedBuilds[buildKeyEncoded]) {
                // --- BELUM VOTE => TAMBAH VOTE ---
                runTransaction(buildRef, (data) => {
                    if(data) {
                        data.votes = (data.votes || 0) + 1;
                        data.rank = rank;
                    } else {
                        data = {
                            items: items,
                            rank: rank,
                            votes: 1,
                            timestamp: Date.now()
                        };
                    }
                    return data;
                });
                
                // Simpan status user sudah vote
                userVotedBuilds[buildKeyEncoded] = rank;
                alert(`Build berhasil diberi nilai ${rank}!`);

            } else {
                // --- SUDAH VOTE => BATALKAN / KURANGI VOTE ---
                if(userVotedBuilds[buildKeyEncoded] === rank) {
                    // Kalau klik tombol YANG SAMA, berarti batal
                    runTransaction(buildRef, (data) => {
                        if(data) {
                            data.votes = Math.max((data.votes || 0) - 1, 0);
                            // Kalau vote 0, bisa hapus data atau biarkan saja
                            if(data.votes === 0) {
                                return null; // Hapus entry dari database
                            }
                        }
                        return data;
                    });

                    // Hapus status vote
                    delete userVotedBuilds[buildKeyEncoded];
                    alert(`Vote untuk nilai ${rank} dibatalkan!`);

                } else {
                    // Kalau klik tombol BEDA, ganti rank
                    runTransaction(buildRef, (data) => {
                        if(data) {
                            data.rank = rank;
                            // votes tidak berubah
                        }
                        return data;
                    });
                    
                    // Update status vote
                    userVotedBuilds[buildKeyEncoded] = rank;
                    alert(`Nilai build diubah menjadi ${rank}!`);
                }
            }
        }

        // Dengarkan perubahan ranking
        const rankingRef = ref(db, 'builds');
        onValue(rankingRef, (snapshot) => {
            const data = snapshot.val();
            const container = document.getElementById('ranking-result');
            container.innerHTML = '';

            if(!data) {
                container.innerHTML = '<p style="text-align:center; color: black !important; opacity:0.8;">Belum ada voting</p>';
                return;
            }

            let buildArray = Object.values(data);
            
            buildArray.sort((a, b) => {
                if (rankValues[b.rank] !== rankValues[a.rank]) {
                    return rankValues[b.rank] - rankValues[a.rank];
                }
                return (b.votes || 0) - (a.votes || 0);
            });

            buildArray.forEach((build) => {
                const div = document.createElement('div');
                div.className = 'ranking-item';

                let imagesHtml = '';
                build.items.forEach(imgUrl => {
                    imagesHtml += `<img src="${imgUrl}" alt="item">`;
                });

                div.innerHTML = `
                    <div class="rank-tier" style="color: ${rankColors[build.rank]}">${build.rank}</div>
                    <div class="build-items">${imagesHtml}</div>
                    <div class="score">🗳️ ${build.votes || 0} Vote</div>
                `;

                container.appendChild(div);
            });
        });

        // Inisialisasi
        updateLikeDisplay('slot1');
        updateLikeDisplay('slot2');
        updateLikeDisplay('slot3');
        updateLikeDisplay('slot4');
        updateLikeDisplay('slot5');
        updateLikeDisplay('slot6');

    </script>

            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.2);
            align-items: center;
            justify-items: center;
        }

        .equipment-area.left,
        .equipment-area.right {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .slot-wrapper {
            text-align: center;
        }

        .slot {
            width: 80px;
            height: 80px;
            border: 2px solid #ccc;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            cursor: pointer;
            background: rgba(0,0,0,0.2);
            overflow: hidden;
            transition: all 0.2s;
        }

        .slot:hover {
            border-color: #fff;
            transform: scale(1.05);
        }

        .slot img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
        }

        .slot .plus-icon {
            position: absolute;
            bottom: 5px;
            right: 5px;
            font-size: 1.2em;
            color: #0f0;
            background: rgba(0,0,0,0.5);
            border-radius: 50%;
            width: 20px;
            height: 20px;
            text-align: center;
            line-height: 20px;
        }

        .like-btn {
            background: none;
            border: none;
            color: #ffcc00;
            font-size: 1.1em;
            cursor: pointer;
            margin-top: 5px;
            text-shadow: 0 0 5px #000;
            transition: all 0.2s;
        }

        .like-btn:hover {
            color: #ffdd33;
            transform: scale(1.1);
        }

        .like-btn.liked {
            color: #ff4444;
        }

        .character-area img {
            max-height: 320px;
            width: auto;
        }

        .vote-section {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.2);
            text-align: center;
        }

        .rank-buttons button {
            padding: 12px 25px;
            margin: 5px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.2em;
            transition: transform 0.2s;
        }

        .rank-buttons button:hover {
            transform: scale(1.1);
        }

        .btn-D { background: #6c757d; color: white; }
        .btn-C { background: #28a745; color: white; }
        .btn-B { background: #007bff; color: white; }
        .btn-A { background: #ffc107; color: black; }
        .btn-S { background: #dc3545; color: white; }

        .ranking-section {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .ranking-item {
            display: flex;
            align-items: center;
            padding: 10px;
            margin: 5px 0;
            border-radius: 8px;
            background: rgba(0,0,0,0.2);
            transition: background 0.2s;
        }

        .ranking-item:hover {
            background: rgba(255,255,255,0.1);
        }

        .rank-tier {
            font-size: 1.8em;
            font-weight: bold;
            width: 60px;
            text-align: center;
            text-shadow: 0 0 5px rgba(0,0,0,0.5);
        }

        .build-items {
            display: flex;
            gap: 5px;
            margin: 0 15px;
        }

        .build-items img {
            width: 35px;
            height: 35px;
            object-fit: contain;
            background: rgba(0,0,0,0.2);
            border-radius: 5px;
            padding: 2px;
        }

        .score {
            background: rgba(255,255,255,0.2);
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            color: black !important;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.8);
        }

        .modal-content {
            background-color: #222;
            margin: 5% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 80%;
            max-width: 700px;
            border-radius: 15px;
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
        }

        .close:hover,
        .close:focus {
            color: white;
            text-decoration: none;
            cursor: pointer;
        }

        .modal-content h2 {
            text-align: center;
            margin-bottom: 20px;
            color: white !important;
            font-size: 1.8em;
        }

        .equipment-options {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }

        .equipment-option {
            width: 65px;
            height: 65px;
            border: 1px solid #555;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #333;
            overflow: hidden;
        }

        .equipment-option img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        @media (max-width: 768px) {
            .builder-container {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            .equipment-area.left, .equipment-area.right {
                flex-direction: row;
                justify-content: center;
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚔️ Build & Ranking</h1>
        <p class="subtitle">Pilih item, lalu berikan vote!</p>

        <div class="builder-container">
            <div class="equipment-area left">
                <div class="slot-wrapper">
                    <div class="slot" onclick="bukaModal('slot1')">
                        <img src="" alt="Slot 1" id="slot1-img">
                        <span class="plus-icon">+</span>
                    </div>
                    <button class="like-btn" id="like-btn-slot1" onclick="toggleLike('slot1')">❤️ <span id="like-count-slot1" style="color: black !important;">0</span></button>
                </div>
                <div class="slot-wrapper">
                    <div class="slot" onclick="bukaModal('slot2')">
                        <img src="" alt="Slot 2" id="slot2-img">
                        <span class="plus-icon">+</span>
                    </div>
                    <button class="like-btn" id="like-btn-slot2" onclick="toggleLike('slot2')">❤️ <span id="like-count-slot2" style="color: black !important;">0</span></button>
                </div>
                <div class="slot-wrapper">
                    <div class="slot" onclick="bukaModal('slot3')">
                        <img src="" alt="Slot 3" id="slot3-img">
                        <span class="plus-icon">+</span>
                    </div>
                    <button class="like-btn" id="like-btn-slot3" onclick="toggleLike('slot3')">❤️ <span id="like-count-slot3" style="color: black !important;">0</span></button>
                </div>
            </div>

            <div class="character-area">
                <img src="https://bioqu.id/uploads/galleries/1884219/bd84969069000b7b7f49c1c88c779694.jpg" alt="Karakter" class="character">
            </div>

            <div class="equipment-area right">
                <div class="slot-wrapper">
                    <div class="slot" onclick="bukaModal('slot4')">
                        <img src="" alt="Slot 4" id="slot4-img">
                        <span class="plus-icon">+</span>
                    </div>
                    <button class="like-btn" id="like-btn-slot4" onclick="toggleLike('slot4')">❤️ <span id="like-count-slot4" style="color: black !important;">0</span></button>
                </div>
                <div class="slot-wrapper">
                    <div class="slot" onclick="bukaModal('slot5')">
                        <img src="" alt="Slot 5" id="slot5-img">
                        <span class="plus-icon">+</span>
                    </div>
                    <button class="like-btn" id="like-btn-slot5" onclick="toggleLike('slot5')">❤️ <span id="like-count-slot5" style="color: black !important;">0</span></button>
                </div>
                <div class="slot-wrapper">
                    <div class="slot" onclick="bukaModal('slot6')">
                        <img src="" alt="Slot 6" id="slot6-img">
                        <span class="plus-icon">+</span>
                    </div>
                    <button class="like-btn" id="like-btn-slot6" onclick="toggleLike('slot6')">❤️ <span id="like-count-slot6" style="color: black !important;">0</span></button>
                </div>
            </div>
        </div>

        <div class="vote-section">
            <h2>🗳️ Berikan Nilai Build Ini</h2>
            <div class="rank-buttons">
                <button class="btn-D" onclick="voteBuild('D')">D</button>
                <button class="btn-C" onclick="voteBuild('C')">C</button>
                <button class="btn-B" onclick="voteBuild('B')">B</button>
                <button class="btn-A" onclick="voteBuild('A')">A</button>
                <button class="btn-S" onclick="voteBuild('S')">S</button>
            </div>
        </div>

        <div class="ranking-section">
            <h2>📊 Daftar Ranking Build</h2>
            <div id="ranking-result">
                <p style="text-align:center; color: black !important; opacity:0.8;">Memuat data...</p>
            </div>
        </div>
    </div>

    <div id="equipmentModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="tutupModal()">×</span>
            <h2>Pilih Perlengkapan</h2>
            <div class="equipment-options" id="equipmentOptions">
            </div>
        </div>
    </div>

</body>
</html>
